name: Stage43G-37 match stat school filters and sorting

on:
  pull_request:
    paths:
      - "phase2_engine/career_match_table_projection.py"
      - "phase2_engine/career_cross_era_gui_pilot.py"
      - "tests/test_stage43g37_match_stat_filters.py"
      - ".github/workflows/career-match-stat-filters.yml"
  push:
    branches: [main]
    paths:
      - "phase2_engine/career_match_table_projection.py"
      - "phase2_engine/career_cross_era_gui_pilot.py"

permissions:
  contents: read

jobs:
  stat_filters_tk:
    name: Immutable school-filtered batting and pitching table in real Tk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ensure virtual Tk display available
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
      - name: Stage43G-37 projection and real Tk controls
        run: |
          xvfb-run -a python -m unittest discover -s tests -p 'test_stage43g37_match_stat_filters.py' -v
      - name: Stage43G-33 through 36 real Tk regressions
        run: |
          xvfb-run -a python -m unittest discover -s tests -p 'test_stage43g3[3456]*.py' -v
