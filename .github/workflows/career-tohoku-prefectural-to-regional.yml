name: Stage43G-47 Tohoku six prefectural qualifiers to regional

on:
  pull_request:
    paths:
      - "phase2_engine/future_tohoku_composite_bridge.py"
      - "phase2_engine/future_yamagata_direct_main_bridge.py"
      - "phase2_engine/career_multi_preview_checkpoint.py"
      - "phase2_engine/career_regional_main_checkpoint.py"
      - "tests/test_stage43g47_tohoku_four_prefecture_feeders.py"
      - ".github/workflows/career-tohoku-prefectural-to-regional.yml"
  push:
    branches: [main]
    paths:
      - "phase2_engine/future_tohoku_composite_bridge.py"
      - "phase2_engine/future_yamagata_direct_main_bridge.py"
      - "phase2_engine/career_multi_preview_checkpoint.py"
      - "phase2_engine/career_regional_main_checkpoint.py"
      - "tests/test_stage43g47_tohoku_four_prefecture_feeders.py"

permissions:
  contents: read

jobs:
  tohoku_six_prefectures:
    name: Saved Iwate Miyagi Yamagata Fukushima plus Aomori Akita qualify Tohoku 14
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Stage43G-47 six saved prefectural events and 14-school Tohoku MAIN
        run: |
          python -m unittest discover -s tests -p 'test_stage43g47_tohoku_four_prefecture_feeders.py' -v
      - name: Stage43G-46 and 45 three-school feeder regressions
        run: |
          python -m unittest discover -s tests -p 'test_stage43g46_aomori_seed_main_third_place.py' -v
          python -m unittest discover -s tests -p 'test_stage43g45_akita_third_place_feeder.py' -v
