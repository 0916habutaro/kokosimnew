name: Stage43G-77 Source-separated school game search Tk

on:
  pull_request:
    paths:
      - "phase2_engine/career_v2_school_game_tk.py"
      - "phase2_engine/career_legacy_school_game_tk.py"
      - "phase2_engine/career_history_tk_pilot.py"
      - "tests/test_stage43g77_dual_school_game_tk.py"
      - ".github/workflows/career-cross-era-school-game-tk.yml"
  push:
    branches: [main]
    paths:
      - "phase2_engine/career_v2_school_game_tk.py"
      - "phase2_engine/career_legacy_school_game_tk.py"
      - "phase2_engine/career_history_tk_pilot.py"
      - "tests/test_stage43g77_dual_school_game_tk.py"

permissions:
  contents: read

jobs:
  dual_school_game_tk:
    name: Real Tk source-gated school match search and SHA provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ensure virtual display exists
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
      - name: Stage43G-77 headless and real Tk dual source checks
        run: |
          xvfb-run -a python -m unittest discover -s tests -p 'test_stage43g77_dual_school_game_tk.py' -v
      - name: Stage43G-75 legacy GUI and Stage43G-76 v2 API regressions
        run: |
          xvfb-run -a python -m unittest discover -s tests -p 'test_stage43g75_legacy_game_filter_tk.py' -v
          python -m unittest discover -s tests -p 'test_stage43g76_v2_school_game_page.py' -v
