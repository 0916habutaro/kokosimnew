name: Stage43G-52 Senbatsu Aichi Mie same-year concurrent results

on:
  pull_request:
    paths:
      - "phase2_engine/future_tokai_concurrent_bridge.py"
      - "phase2_engine/career_multi_preview_checkpoint.py"
      - "phase2_engine/career_tokai_concurrent_preflight.py"
      - "tests/test_stage43g52_concurrent_tokai_prefectural_checkpoint.py"
      - ".github/workflows/career-tokai-concurrent-results.yml"
  push:
    branches: [main]
    paths:
      - "phase2_engine/future_tokai_concurrent_bridge.py"
      - "phase2_engine/career_multi_preview_checkpoint.py"
      - "phase2_engine/career_tokai_concurrent_preflight.py"
      - "tests/test_stage43g52_concurrent_tokai_prefectural_checkpoint.py"

permissions:
  contents: read

jobs:
  concurrent_tokai:
    name: Senbatsu Aichi Mie concurrent qualifier-to-MAIN shared annual save E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Stage43G-52 concurrent 3 tournaments saved annual replay
        run: |
          python -m unittest discover -s tests -p 'test_stage43g52_concurrent_tokai_prefectural_checkpoint.py' -v
      - name: Stage43G-51 preseason freeze and Stage43G-50 proof regression
        run: |
          python -m unittest discover -s tests -p 'test_stage43g51_tokai_concurrent_preflight.py' -v
          python -m unittest discover -s tests -p 'test_stage43g50_tokai_senbatsu_access_gate.py' -v
