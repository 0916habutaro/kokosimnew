name: Windows personal game acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-game-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows_acceptance:
    name: Windows Python 3.12 game save resume and real Tk
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve compatibility input bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Generate owned 8-school game and restart actual processes
        run: |
          New-Item -ItemType Directory -Path audit-results | Out-Null
          python tests/stage43g97_audit.py --require-windows --json-output audit-results/windows-headless.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native mapped Tk events score innings players and GUI restart
        run: |
          python tests/stage43g97_audit.py --require-windows --gui --json-output audit-results/windows-tk.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stage43g97-windows-acceptance
          path: audit-results/*.json
          if-no-files-found: error
          retention-days: 14

  linux_auxiliary:
    name: Auxiliary Linux game acceptance and real Tk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Set up auxiliary display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Same fixture and read-only oracle regressions
        run: |
          mkdir -p audit-results
          python tests/stage43g97_audit.py --json-output audit-results/linux-headless.json
          xvfb-run -a python tests/stage43g97_audit.py --gui --json-output audit-results/linux-tk.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stage43g97-linux-auxiliary
          path: audit-results/*.json
          if-no-files-found: error
          retention-days: 14
