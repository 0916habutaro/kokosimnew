name: Stage43G-86 Long-span century shard scale audit

on:
  pull_request:
    paths:
      - "phase2_engine/career_v2_century_scale_benchmark.py"
      - "tests/test_stage43g86_v2_century_shard_scale.py"
      - ".github/workflows/career-v2-century-scale-audit.yml"
  push:
    branches: [main]
    paths:
      - "phase2_engine/career_v2_century_scale_benchmark.py"
      - "tests/test_stage43g86_v2_century_shard_scale.py"

permissions:
  contents: read

jobs:
  century_scale:
    name: 4/16/32 shard exact-source and bounded performance audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Stage43G-86 32 sparse fictional seasons and page timing
        run: |
          python -m unittest discover -s tests -p 'test_stage43g86_v2_century_shard_scale.py' -v
      - name: Regress Stage43G-83 cross-century and Stage43G-85 candidate choices
        run: |
          python -m unittest discover -s tests -p 'test_stage43g83_v2_century_shards.py' -v
          if command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run -a python -m unittest discover -s tests -p 'test_stage43g85_v2_century_candidates_tk.py' -v
          else
            python -m unittest discover -s tests -p 'test_stage43g85_v2_century_candidates_tk.py' -v
          fi
