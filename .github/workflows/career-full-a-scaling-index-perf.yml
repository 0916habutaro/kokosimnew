name: Stage43G-73 Full-A 5-dimension controlled history scaling

on:
  pull_request:
    paths:
      - "phase2_engine/career_full_a_benchmark.py"
      - "phase2_engine/career_full_a_scaling_study.py"
      - "tests/test_stage43g73_full_a_scaling_study.py"
      - ".github/workflows/career-full-a-scaling-index-perf.yml"
  push:
    branches: [main]
    paths:
      - "phase2_engine/career_full_a_benchmark.py"
      - "phase2_engine/career_full_a_scaling_study.py"
      - "tests/test_stage43g73_full_a_scaling_study.py"

permissions:
  contents: read

jobs:
  incremental_full_a:
    name: Isolated school-year-game dimensions plus combined full-A scale with indexed reads
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Stage43G-73 five fictional A scale cases + all contracts
        run: |
          python -m unittest discover -s tests -p 'test_stage43g73_full_a_scaling_study.py' -v
      - name: Existing full Option A progression and pair-index regressions
        run: |
          python -m unittest discover -s tests -p 'test_stage43g21_full_a_storage_benchmark.py' -v
          python -m unittest discover -s tests -p 'test_stage43g72_paired_index_benchmark.py' -v
      - name: Write actual comparable five-case SQLite metrics
        run: |
          mkdir -p build/reports
          python -m phase2_engine.career_full_a_scaling_study \
            --data-root data --repeats 1 \
            --output-json build/reports/stage43g73_full_a_scale.json \
            > build/reports/stage43g73_runner_stdout.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("build/reports/stage43g73_full_a_scale.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          print("Controlled cases", data["case_labels"])
          for row in data["cases"]:
              print(row["case"], "matches", row["archived_complete_a_matches"],
                    "physical SQLite bytes", row["saved_sqlite_files_bytes"],
                    "cached indexed browse median ms",
                    row["browse_and_stat_read_latency_ms"][
                        "school_results_page"
                    ]["median_of_school_sample_medians_ms"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage43g73-five-case-full-a-index-storage-read-measurements
          path: build/reports/stage43g73_full_a_scale.json
          retention-days: 30
          if-no-files-found: error
