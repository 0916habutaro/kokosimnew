name: Stage43G-109 Windows persistent Yamanashi demo
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stage43g109-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows_demo:
    name: Windows Python 3.12 persistent demo 31 games restart and eleven old exports
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: New persistent namespace actual full31 separate Python restart zero skips
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path audit-results | Out-Null
          python tests/stage43g109_audit.py --require-windows --json-output audit-results/persistent-demo.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stage43g109-windows-persistent-demo
          path: audit-results/*.json
          if-no-files-found: error
  windows_native_tk:
    name: Windows Python 3.12 mapped Tk new exit separate process continue history
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Mapped Tk button operations 1 16 31 games and all660 history zero skips
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path audit-results | Out-Null
          python tests/stage43g109_audit.py --require-windows --gui --json-output audit-results/persistent-tk.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stage43g109-windows-persistent-tk
          path: audit-results/*.json
          if-no-files-found: error
