name: Stage43G-93 legacy quiescent export lab

on:
  pull_request:
    paths:
      - 'phase2_engine/school_roster_*.py'
      - 'tests/*stage43g112*.py'
      - 'phase2_engine/yamanashi_annual_rosters.py'
      - 'tests/*stage43g111*.py'
      - 'phase2_engine/yamanashi_demo*.py'
      - 'tests/*stage43g109*.py'
      - 'phase2_engine/yamanashi_tournament*.py'
      - 'tests/*stage43g108*.py'
      - 'phase2_engine/joint_tournament*.py'
      - 'tests/*stage43g107*.py'
      - 'tests/*stage43g103*.py'
      - 'tests/*stage43g104*.py'
      - 'tests/*stage43g105*.py'
      - 'phase2_engine/registered_*.py'
      - 'phase2_engine/joint_team_registration*.py'
      - 'phase2_engine/legacy_quiescent_export_audit.py'
      - 'phase2_engine/save_inventory_audit.py'
      - 'phase2_engine/historical_match_archive.py'
      - 'phase2_engine/career_roster_archive.py'
      - 'phase2_engine/live*.py'
      - 'phase2_engine/save_slots.py'
      - 'game_core/**'
      - 'data/**'
      - 'config/**'
      - 'tests/*stage43g9*.py'
      - 'docs/research/stage43g93_*.md'
      - 'audits/phase2/stage43g93/**'
      - '.github/workflows/legacy-quiescent-export.yml'
  push:
    branches: [main]
    paths:
      - 'phase2_engine/school_roster_*.py'
      - 'tests/*stage43g112*.py'
      - 'phase2_engine/yamanashi_annual_rosters.py'
      - 'tests/*stage43g111*.py'
      - 'phase2_engine/yamanashi_demo*.py'
      - 'tests/*stage43g109*.py'
      - 'phase2_engine/legacy_quiescent_export_audit.py'
      - 'tests/*stage43g93*.py'
      - '.github/workflows/legacy-quiescent-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    name: Fixture-only export on ${{ matrix.os }} Python 3.12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Self-owned export candidates and deterministic refusal faults
        run: |
          mkdir -p audit-results
          python -m phase2_engine.legacy_quiescent_export_audit --json-output audit-results/export.json > audit-results/export.log 2>&1
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('audit-results/export.json').read_text(encoding='utf-8'))
          assert data['successful'] and data['tests'] == 29 and data['skipped'] == 0
          assert data['fixture_only'] and not data['production_writers_changed']
          assert not data['generation_adopted'] and not data['restoration_authorized']
          assert {m['phase'] for m in data['metrics']} == {'active', 'sealed', 'registered'}
          assert all(m['copy_bytes'] > 0 and m['complete_a_matches'] > 0 for m in data['metrics'])
          assert all(m['peak_payload_file_bytes'] >= m['copy_bytes'] for m in data['metrics'])
          print(json.dumps({k: data[k] for k in ('os', 'tests', 'seconds', 'metrics')}, ensure_ascii=False))
          PY
      - name: Stage91 and Stage92 safe inventory concurrency and live replay
        run: |
          python -m phase2_engine.save_inventory_audit --json-output audit-results/inventory.json > audit-results/inventory.log 2>&1
          python -m phase2_engine.legacy_archive_concurrency_audit --json-output audit-results/concurrency.json > audit-results/concurrency.log 2>&1
      - name: Annual registration continuity and checkpoint regression
        run: |
          python -m phase2_engine.legacy_quiescent_export_audit --annual-regressions --json-output audit-results/annual.json > audit-results/annual.log 2>&1
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('audit-results/annual.json').read_text(encoding='utf-8'))
          assert data['successful'] and data['tests'] == 37 and data['skipped'] == 0
          assert data['fixture_only'] and data['annual_fixture_teardown']
          PY
      - name: Show diagnostics if a check fails
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in sorted(Path('audit-results').glob('*')):
              print(p.name)
              print(p.read_text(encoding='utf-8', errors='replace'))
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stage43g93-export-${{ matrix.os }}
          path: audit-results/*
          retention-days: 14
