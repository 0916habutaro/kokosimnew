name: Stage43G-45 Akita spring third-place feeder proof

on:
  pull_request:
    paths:
      - "phase2_engine/chiba_third_place_checkpoint.py"
      - "phase2_engine/same_year_regional_feeder_gate.py"
      - "phase2_engine/future_akita_direct_main_bridge.py"
      - "phase2_engine/career_multi_preview_checkpoint.py"
      - "tests/test_stage43g45_akita_third_place_feeder.py"
      - ".github/workflows/career-akita-third-place-feeder.yml"
  push:
    branches: [main]
    paths:
      - "phase2_engine/chiba_third_place_checkpoint.py"
      - "phase2_engine/same_year_regional_feeder_gate.py"
      - "phase2_engine/future_akita_direct_main_bridge.py"
      - "tests/test_stage43g45_akita_third_place_feeder.py"

permissions:
  contents: read

jobs:
  akita_third_place:
    name: Archived Akita third-place game certifies Tohoku third representative
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Stage43G-45 Akita third place and partial Tohoku entitlement
        run: |
          python -m unittest discover -s tests -p 'test_stage43g45_akita_third_place_feeder.py' -v
      - name: Original Chiba third-place and Shikoku feeder regressions
        run: |
          python -m unittest discover -s tests -p 'test_stage43g6_chiba_tokyo_multisave.py' -v
          python -m unittest discover -s tests -p 'test_stage43g44_shikoku_prefecture_to_regional_e2e.py' -v
