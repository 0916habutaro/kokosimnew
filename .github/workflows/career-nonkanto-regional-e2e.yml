name: Stage43G-39 non-Kanto regional saved-game E2E

on:
  pull_request:
    paths:
      - "phase2_engine/future_non_kanto_regional_main_bridge.py"
      - "phase2_engine/career_multi_preview_checkpoint.py"
      - "tests/test_stage43g39_nonkanto_regional_career_e2e.py"
      - ".github/workflows/career-nonkanto-regional-e2e.yml"
  push:
    branches: [main]
    paths:
      - "phase2_engine/future_non_kanto_regional_main_bridge.py"
      - "phase2_engine/career_multi_preview_checkpoint.py"
      - "tests/test_stage43g39_nonkanto_regional_career_e2e.py"

permissions:
  contents: read

jobs:
  non_kanto_regional_career:
    name: Tokai and Shikoku saved match A-details and replay E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Stage43G-39 cross-regional career E2E
        run: |
          python -m unittest discover -s tests -p 'test_stage43g39_nonkanto_regional_career_e2e.py' -v
      - name: Earlier multi-competition career and Kanto input tests
        run: |
          python -m unittest discover -s tests -p 'test_stage43g2_multi_competition_checkpoint.py' -v
          python -m unittest discover -s tests -p 'test_stage43g5_direct_main_kanto.py' -v
