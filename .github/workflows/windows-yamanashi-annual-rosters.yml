name: Stage43G-111 Windows annual roster lineage and cross-prefecture contract
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stage43g111-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows_annual_rosters:
    name: Windows Python 3.12 full31 annual33 practice2027 fictional tournament2 bracket7 and nineteen old exports
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Saved2027 direct SQL actual practice1 independent oracle restart and true old113 zero skips
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path audit-results | Out-Null
          python tests/stage43g114_audit.py --require-windows --json-output audit-results/practice2027.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        with:
          name: stage43g114-windows-practice
          path: audit-results/practice2027.json
          if-no-files-found: error
          retention-days: 14
      - name: Real saved31 seed event bracket seal all33 annual lineage and restart zero skips
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path audit-results | Out-Null
          python tests/stage43g111_audit.py --require-windows --json-output audit-results/annual-rosters.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Cross-prefecture common contract real master Nagano4 Yamanashi33 zero skips
        shell: pwsh
        run: |
          python tests/stage43g112_audit.py --require-windows --json-output audit-results/cross-prefecture-rosters.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Saved SQLite cross-prefecture100 hard exit resume independent tournament gate zero skips
        shell: pwsh
        run: |
          python tests/stage43g113_audit.py --require-windows --json-output audit-results/saved-cross-prefecture100.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Independent2027 entry joint qualification district seed draw schedule dry-run and true old114 zero skips
        shell: pwsh
        run: |
          python tests/stage43g115_audit.py --require-windows --json-output audit-results/competition-evidence2027.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fictional2027 three teams two games incremental hard-exit resume full-A and true old115 zero skips
        shell: pwsh
        run: |
          python tests/stage43g116_audit.py --require-windows --json-output audit-results/fictional-tournament2027.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fictional2027 eight teams seven games generic bracket hard-exit resume full-A and true old116 zero skips
        shell: pwsh
        run: |
          python tests/stage43g117_audit.py --require-windows --json-output audit-results/fictional-bracket2027.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stage43g111-windows-annual-rosters
          path: audit-results/*.json
          if-no-files-found: error
          retention-days: 14
