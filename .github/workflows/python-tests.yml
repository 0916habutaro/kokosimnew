name: Python tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: Python 3.12 unittest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run full unittest suite
        run: python -m unittest discover -s tests -v

      # TEMP_STAGE13B4_AUDIT
      - name: Stage 13B-4 distribution audit
        run: |
          python -m game_core.stage13b4_audit \
            --config-dir config/abilities \
            --year 2026 \
            --seeds 2026100701,2026100702,2026100703 \
            --school-count 1000 \
            --output /tmp/stage13b4_audit.csv
          echo "STAGE13B4_AUDIT_BEGIN"
          cat /tmp/stage13b4_audit.csv
          echo "STAGE13B4_AUDIT_END"
