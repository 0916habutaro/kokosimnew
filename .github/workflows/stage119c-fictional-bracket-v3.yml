name: Stage119-C SQLite v3 independent audit
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stage119c-v3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sqlite_v3:
    name: ${{ matrix.os }} v3 real16/32 faults oracle old20 performance
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Independent real E2E, failure matrix, twenty legacy exports and measured v2/v3
        shell: bash
        run: |
          mkdir -p audit-results
          extra=""
          if [ "$RUNNER_OS" = "Windows" ]; then extra="--require-windows"; fi
          python tests/stage43g119c_audit.py $extra --old-versions --json-output audit-results/v3-${{ matrix.os }}.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stage119c-v3-${{ matrix.os }}
          path: audit-results/*.json
          if-no-files-found: error
          retention-days: 14
