name: Stage 12M temporary verification

on:
  push:
    branches:
      - stage12m-hokkaido-tohoku-summer-dates

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Full season E2E markers
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          from phase2_engine import DataRepository, SeasonOrchestrator

          data=Path("data")
          repo=DataRepository(data)
          s=SeasonOrchestrator(repo,data).run_structural_season(2026,2026100501)

          with (data/"schedules"/"2026"/"season_calendar.csv").open(encoding="utf-8-sig", newline="") as f:
              cal=list(csv.DictReader(f))
          by={r["competition_id"]:r for r in cal}
          summer_ids=[
              cid for cid,c in repo.competitions.items()
              if c["competition_type"]=="summer_local_qualifier"
          ]
          detailed=[cid for cid in summer_ids if by[cid]["game_date_list"]]

          print(f"COMPETITION_RUNS={len(s.competition_runs)}")
          print(f"SUMMER_LOCAL_DETAILED={len(detailed)}")
          print(f"SUMMER_LOCAL_REMAINING={49-len(detailed)}")
          print(f"BLOCK1_MATCH_DAYS={sum(len(by[cid]['game_date_list'].split(';')) for cid in ['CMP000023','CMP000024','CMP000025','CMP000026','CMP000027','CMP000028','CMP000029','CMP000030'])}")
          print(f"PREFECTURAL_PASS={sum(r.status == 'PASS' for r in s.prefectural_rows)}")
          print(f"REGIONAL_PASS={sum(r.status == 'PASS' for r in s.regional_rows)}")
          print(f"QUALIFICATION_PASS={sum(r.status == 'PASS' for r in s.qualification_resolutions)}")
          print(f"ACCESS_PASS={sum(r.status == 'PASS' for r in s.access_resolutions)}")
          print(f"CALENDAR_GAPS={len(s.calendar_gaps)}")
          print(f"INTERNAL_GAPS={len(s.internal_structure_gaps)}")
          print(f"REGIONAL_BRIDGE_GAPS={len(s.regional_bridge_gaps)}")
          print(f"WARNINGS={s.warnings}")
          PY
