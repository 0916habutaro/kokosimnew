name: Stage43G-103 Windows read-only joint team boundary
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stage43g103-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows_product:
    name: Windows Python 3.12 joint provenance refusal and five old exports
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Ten provenance and refusal checks with zero skips
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path audit-results | Out-Null
          python tests/stage43g103_audit.py --require-windows --json-output audit-results/product.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage104 registered team contract and six old versions zero skips
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python tests/stage43g104_audit.py --require-windows --json-output audit-results/stage104-product.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stage43g103-windows-product
          path: audit-results/*.json
          if-no-files-found: error
  windows_native_tk:
    name: Windows Python 3.12 native Tk original school player IDs
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Mapped readonly preview SQLite close rename reopen zero skips
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path audit-results | Out-Null
          python tests/stage43g103_audit.py --require-windows --gui --json-output audit-results/tk.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage104 mapped team origin school player and failure close zero skips
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python tests/stage43g104_audit.py --require-windows --gui --json-output audit-results/stage104-tk.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stage43g103-windows-native-tk
          path: audit-results/*.json
          if-no-files-found: error
