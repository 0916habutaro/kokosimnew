name: Stage43G-111 Windows annual roster lineage and cross-prefecture contract
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stage43g111-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows_annual_rosters:
    name: Windows Python 3.12 full31 annual33 Nagano4 common contract and fifteen old exports
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Real saved31 seed event bracket seal all33 annual lineage and restart zero skips
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path audit-results | Out-Null
          python tests/stage43g111_audit.py --require-windows --json-output audit-results/annual-rosters.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Cross-prefecture common contract real master Nagano4 Yamanashi33 zero skips
        shell: pwsh
        run: |
          python tests/stage43g112_audit.py --require-windows --json-output audit-results/cross-prefecture-rosters.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Saved SQLite cross-prefecture100 hard exit resume independent tournament gate zero skips
        shell: pwsh
        run: |
          python tests/stage43g113_audit.py --require-windows --json-output audit-results/saved-cross-prefecture100.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stage43g111-windows-annual-rosters
          path: audit-results/*.json
          if-no-files-found: error
          retention-days: 14
