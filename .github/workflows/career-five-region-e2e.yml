name: Stage43G-40 five-region saved-game career E2E

on:
  pull_request:
    paths:
      - "tests/test_stage43g40_five_region_career_e2e.py"
      - ".github/workflows/career-five-region-e2e.yml"
      - "phase2_engine/career_multi_preview_checkpoint.py"
      - "phase2_engine/future_non_kanto_regional_main_bridge.py"
  push:
    branches: [main]
    paths:
      - "tests/test_stage43g40_five_region_career_e2e.py"
      - ".github/workflows/career-five-region-e2e.yml"

permissions:
  contents: read

jobs:
  five_region_career:
    name: Tohoku Hokushinetsu Kinki Chugoku Kyushu 49-game career save E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Five regional saved A-stats and readonly browse integration
        run: |
          python -m unittest discover -s tests -p 'test_stage43g40_five_region_career_e2e.py' -v
      - name: Stage43G-39 original Tokai Shikoku region E2E
        run: |
          python -m unittest discover -s tests -p 'test_stage43g39_nonkanto_regional_career_e2e.py' -v
