name: Stage43G-63 Read-only history Tk shell and view projection

on:
  pull_request:
    paths:
      - "phase2_engine/career_history_gui_bridge.py"
      - "phase2_engine/career_history_view_projection.py"
      - "phase2_engine/career_history_tk_pilot.py"
      - "tests/test_stage43g63_history_view_tk.py"
      - ".github/workflows/career-history-tk-shell.yml"
  push:
    branches: [main]
    paths:
      - "phase2_engine/career_history_view_projection.py"
      - "phase2_engine/career_history_tk_pilot.py"
      - "tests/test_stage43g63_history_view_tk.py"

permissions:
  contents: read

jobs:
  tk_history_shell:
    name: Real Tk year school match player read-only verified IDs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Xvfb when unavailable
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
      - name: Stage43G-63 real Tk and projection
        run: |
          xvfb-run -a python -m unittest discover -s tests -p 'test_stage43g63_history_view_tk.py' -v
      - name: Stage43G-60 to 62 navigation regression
        run: |
          python -m unittest discover -s tests -p 'test_stage43g60_cross_era_year_catalog.py' -v
          python -m unittest discover -s tests -p 'test_stage43g61_cross_era_keyset_probe.py' -v
          python -m unittest discover -s tests -p 'test_stage43g62_history_gui_bridge.py' -v
