name: Stage43G-108 Windows Yamanashi32 staged tournament
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stage43g108-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows_tournament:
    name: Windows Python 3.12 Gates A B C restart faults and ten old exports
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Registration then 8 and 32 entrants with real restart zero skips
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path audit-results | Out-Null
          python tests/stage43g108_audit.py --require-windows --json-output audit-results/tournament.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stage43g108-windows-tournament
          path: audit-results/*.json
          if-no-files-found: error
  windows_native_tk:
    name: Windows Python 3.12 native Tk 32 teams school player totals
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Mapped 32-team navigation scroll refusal close rename reopen zero skips
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path audit-results | Out-Null
          python tests/stage43g108_audit.py --require-windows --gui --json-output audit-results/tk.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stage43g108-windows-native-tk
          path: audit-results/*.json
          if-no-files-found: error
