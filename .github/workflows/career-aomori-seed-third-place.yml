name: Stage43G-46 Aomori seeded spring and Tohoku third-place feeder

on:
  pull_request:
    paths:
      - "phase2_engine/future_aomori_seed_main_bridge.py"
      - "phase2_engine/career_multi_preview_checkpoint.py"
      - "phase2_engine/chiba_third_place_checkpoint.py"
      - "phase2_engine/same_year_regional_feeder_gate.py"
      - "tests/test_stage43g46_aomori_seed_main_third_place.py"
      - ".github/workflows/career-aomori-seed-third-place.yml"
  push:
    branches: [main]
    paths:
      - "phase2_engine/future_aomori_seed_main_bridge.py"
      - "phase2_engine/chiba_third_place_checkpoint.py"
      - "phase2_engine/same_year_regional_feeder_gate.py"
      - "tests/test_stage43g46_aomori_seed_main_third_place.py"

permissions:
  contents: read

jobs:
  aomori_seed_main:
    name: Four Aomori FMT018-21 seeded groups and verified third representative
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Stage43G-46 Aomori seed event to MAIN and certified third place
        run: |
          python -m unittest discover -s tests -p 'test_stage43g46_aomori_seed_main_third_place.py' -v
      - name: Stage43G-45 Akita and Chiba regional third-place regression
        run: |
          python -m unittest discover -s tests -p 'test_stage43g45_akita_third_place_feeder.py' -v
          python -m unittest discover -s tests -p 'test_stage43g6_chiba_tokyo_multisave.py' -v
