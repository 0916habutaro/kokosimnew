name: Stage43G-85 v2 school century shard candidate picker

on:
  pull_request:
    paths:
      - "phase2_engine/career_v2_school_century_candidates.py"
      - "phase2_engine/career_legacy_school_game_tk.py"
      - "tests/test_stage43g85_v2_century_candidates_tk.py"
      - ".github/workflows/career-v2-century-candidate-tk.yml"
  push:
    branches: [main]
    paths:
      - "phase2_engine/career_v2_school_century_candidates.py"
      - "phase2_engine/career_legacy_school_game_tk.py"
      - "tests/test_stage43g85_v2_century_candidates_tk.py"

permissions:
  contents: read

jobs:
  candidate_picker:
    name: Explicit saved-century candidate list and real Tk proof gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ensure virtual Tk display exists
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
      - name: Stage43G-85 candidate model and real Tk manual staging
        run: |
          xvfb-run -a python -m unittest discover -s tests -p 'test_stage43g85_v2_century_candidates_tk.py' -v
      - name: Regress Stage43G-84 GUI and Stage43G-83 century source verification
        run: |
          xvfb-run -a python -m unittest discover -s tests -p 'test_stage43g84_v2_cross_century_tk.py' -v
          python -m unittest discover -s tests -p 'test_stage43g83_v2_century_shards.py' -v
