name: Stage43G-80 Optional v2 school index Tk pilot

on:
  pull_request:
    paths:
      - "phase2_engine/career_v2_school_game_tk.py"
      - "phase2_engine/career_legacy_school_game_tk.py"
      - "phase2_engine/career_history_tk_pilot.py"
      - "tests/test_stage43g80_optional_v2_school_index_tk.py"
      - ".github/workflows/career-v2-optional-index-tk.yml"
  push:
    branches: [main]
    paths:
      - "phase2_engine/career_v2_school_game_tk.py"
      - "phase2_engine/career_legacy_school_game_tk.py"
      - "phase2_engine/career_history_tk_pilot.py"
      - "tests/test_stage43g80_optional_v2_school_index_tk.py"

permissions:
  contents: read

jobs:
  optional_index_tk:
    name: Read-only optional index and real Tk rollback
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ensure virtual display exists
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
      - name: Stage43G-80 headless source selection and real Tk
        run: xvfb-run -a python -m unittest discover -s tests -p 'test_stage43g80_optional_v2_school_index_tk.py' -v
      - name: Regress Stage43G-77 GUI and Stage43G-79 school index
        run: |
          xvfb-run -a python -m unittest discover -s tests -p 'test_stage43g77_dual_school_game_tk.py' -v
          python -m unittest discover -s tests -p 'test_stage43g79_v2_school_read_index.py' -v
