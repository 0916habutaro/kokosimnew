name: Stage43G-41 Hokkaido autumn branch-to-MAIN saved-game E2E

on:
  pull_request:
    paths:
      - "phase2_engine/career_multi_preview_checkpoint.py"
      - "tests/test_stage43g41_hokkaido_autumn_qualifier_career_e2e.py"
      - ".github/workflows/career-hokkaido-autumn-e2e.yml"
  push:
    branches: [main]
    paths:
      - "phase2_engine/career_multi_preview_checkpoint.py"
      - "tests/test_stage43g41_hokkaido_autumn_qualifier_career_e2e.py"

permissions:
  contents: read

jobs:
  hokkaido_branch_main:
    name: Hokkaido 10-branch FMT001 to MAIN saved A-stats E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Stage43G-41 Hokkaido 10-branch to main saved career
        run: |
          python -m unittest discover -s tests -p 'test_stage43g41_hokkaido_autumn_qualifier_career_e2e.py' -v
      - name: Original multi-event career and previous regional E2E
        run: |
          python -m unittest discover -s tests -p 'test_stage43g39_nonkanto_regional_career_e2e.py' -v
