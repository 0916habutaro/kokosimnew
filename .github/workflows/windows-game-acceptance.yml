name: Windows personal game acceptance

# Windows専用ゲームのうち、OSで動きが変わるもの（保存・読込・スロット・履歴・ファイルパス・
# 文字コード・画面の起動）だけをWindows上で確かめる。機能のロジックのテストは
# python-tests.yml の全件実行（Linux）に任せる。一覧に入れる基準は AGENTS.md の「テスト」。
# main へのマージ後（push）と手動実行のときは、EXE を作って起動の確認もする。

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-game-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows_acceptance:
    name: Windows Python 3.12 product save load and Tk browse
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Keep LF line endings so data hashes match Linux
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Classify CI workload (fail closed)
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python tests/ci_change_scope.py
      - name: Verify documentation-only routing
        if: steps.scope.outputs.docs_only == 'true'
        run: python -m unittest discover -s tests -p 'test_ci_change_scope.py' -v
      - name: Install screen packages (pywebview)
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          python -m pip install -r requirements.txt
          python -c "import webview; print('pywebview', webview.__version__ if hasattr(webview, '__version__') else 'ok')"
      - name: Save load slots history files and screen startup tests on Windows
        if: steps.scope.outputs.docs_only != 'true'
        env:
          PYTHONUTF8: '1'
        run: |
          $patterns = @(
            'test_stage13e3e1_full_season_save_load.py',
            'test_stage13e3e2_save_slots_game_service.py',
            'test_stage13e3e3_cli_metadata_migration.py',
            'test_stage43c_live_history_archive.py',
            'test_stage43c2_incremental_checkpoint.py',
            'test_stage43d_career_year_boundary.py',
            'test_stage43e_career_rosters.py',
            'test_stage43g92_legacy_concurrency.py',
            'test_archive_compact.py',
            'test_screen_saves.py',
            'test_screen_closed_year.py',
            'test_koshien_records.py',
            'test_data_integrity.py'
          )
          $ErrorActionPreference = 'Continue'
          foreach ($p in $patterns) {
            $out = python -m unittest discover -s tests -t tests -p $p -v 2>&1 | Out-String
            $code = $LASTEXITCODE
            Write-Output $out
            if ($code -ne 0) {
              # 失敗時は末尾を注記に残す（ログを取得できない環境からも原因を読めるようにする）
              $tail = ($out -split "`r?`n" | Select-Object -Last 40) -join "`n"
              $msg = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=$p failed::$msg"
              exit $code
            }
          }
      - name: Build the EXE (PyInstaller) and check that it starts
        # PRでは作らない（時間がかかるため）。main へのマージ後と手動実行のときだけ
        if: steps.scope.outputs.docs_only != 'true' && github.event_name != 'pull_request'
        run: |
          # build_exe.bat は最後に pause するので、入力を空にして待たずに終わらせる
          cmd /c "build_exe.bat < NUL"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = 'dist\kokosimnew\kokosimnew.exe'
          if (-not (Test-Path $exe)) { Write-Output "::error title=EXE::$exe がありません"; exit 1 }
          # 画面を出さない起動の確認。コンソールのない EXE なので結果はセーブの隣のログに出る
          $saves = Join-Path $env:RUNNER_TEMP 'exe-check-saves'
          $proc = Start-Process -FilePath $exe -ArgumentList @('--check', '--save-root', $saves) -PassThru
          $null = $proc.Handle  # 終了コードを読めるようにする
          if (-not $proc.WaitForExit(120000)) { $proc.Kill(); Write-Output "::error title=EXE::2分で終わりません"; exit 1 }
          $log = Join-Path $saves 'kokosimnew.log'
          if (Test-Path $log) { Get-Content $log -Encoding utf8 }
          if ($proc.ExitCode -ne 0) { Write-Output "::error title=EXE::起動の確認が失敗しました（$($proc.ExitCode)）"; exit 1 }
          if (-not (Select-String -Path $log -Pattern '起動の確認' -Quiet -Encoding utf8)) {
            Write-Output "::error title=EXE::起動の確認の記録がありません"; exit 1
          }
