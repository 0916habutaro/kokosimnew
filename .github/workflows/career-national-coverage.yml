name: Stage43G-38 nationwide school and competition input audit

on:
  pull_request:
    paths:
      - "phase2_engine/career_national_coverage_audit.py"
      - "tests/test_stage43g38_nationwide_school_competition_coverage.py"
      - ".github/workflows/career-national-coverage.yml"
  push:
    branches: [main]
    paths:
      - "phase2_engine/career_national_coverage_audit.py"

permissions:
  contents: read

jobs:
  nationwide_master:
    name: 47 prefectures and real school IDs mapped to 162 tournaments
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: National school and tournament plan audit
        run: |
          python -m unittest discover -s tests -p 'test_stage43g38_nationwide_school_competition_coverage.py' -v
