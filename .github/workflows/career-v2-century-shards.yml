name: Stage43G-83 Fictional v2 school century-shard cross-range lookup

on:
  pull_request:
    paths:
      - "phase2_engine/career_v2_school_century_shards.py"
      - "tests/test_stage43g83_v2_century_shards.py"
      - ".github/workflows/career-v2-century-shards.yml"
  push:
    branches: [main]
    paths:
      - "phase2_engine/career_v2_school_century_shards.py"
      - "tests/test_stage43g83_v2_century_shards.py"

permissions:
  contents: read

jobs:
  century_shards:
    name: Cross-century exact-source and page-bounds audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Stage43G-83 sealed century indexes and global pages
        run: |
          python -m unittest discover -s tests -p 'test_stage43g83_v2_century_shards.py' -v
      - name: Stage43G-79 original school-index and Stage43G-81 lifecycle regressions
        run: |
          python -m unittest discover -s tests -p 'test_stage43g79_v2_school_read_index.py' -v
          python -m unittest discover -s tests -p 'test_stage43g81_v2_school_index_health.py' -v
