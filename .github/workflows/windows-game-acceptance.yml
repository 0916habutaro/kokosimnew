name: Windows personal game acceptance

# Windows専用ゲームの本体（保存・再開・Tk画面）をWindows上で確認する唯一のCI。
# Linuxでの同じテストは python-tests.yml の全件実行に含まれるため、ここではWindowsのみ実行する。

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-game-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows_acceptance:
    name: Windows Python 3.12 game save resume and real Tk
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve compatibility input bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Classify CI workload (fail closed)
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python tests/ci_change_scope.py
      - name: Verify documentation-only routing
        if: steps.scope.outputs.docs_only == 'true'
        run: python -m unittest discover -s tests -p 'test_ci_change_scope.py' -v
      - name: Generate owned 8-school game and restart actual processes
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          New-Item -ItemType Directory -Path audit-results | Out-Null
          python tests/stage43g97_audit.py --require-windows --json-output audit-results/windows-headless.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native mapped Tk events score innings players and GUI restart
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          python tests/stage43g97_audit.py --require-windows --gui --json-output audit-results/windows-tk.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        if: always() && steps.scope.outputs.docs_only != 'true'
        with:
          name: stage43g97-windows-acceptance
          path: audit-results/*.json
          if-no-files-found: error
          retention-days: 14
