name: Stage43G-61 Cross-era keyset archive performance and GUI intake

on:
  pull_request:
    paths:
      - "phase2_engine/career_cross_era_year_catalog.py"
      - "phase2_engine/career_cross_era_year_probe.py"
      - "phase2_engine/career_cross_era_gui_pilot.py"
      - "tests/test_stage43g61_cross_era_keyset_probe.py"
      - ".github/workflows/career-cross-era-keyset-probe.yml"
  push:
    branches: [main]
    paths:
      - "phase2_engine/career_cross_era_year_catalog.py"
      - "phase2_engine/career_cross_era_year_probe.py"
      - "phase2_engine/career_cross_era_gui_pilot.py"
      - "tests/test_stage43g61_cross_era_keyset_probe.py"

permissions:
  contents: read

jobs:
  keyset_long_history:
    name: 1250 year metadata seek pagination and no-write measurement
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Stage43G-61 keyset and 1250 synthetic headers
        run: |
          python -m unittest discover -s tests -p 'test_stage43g61_cross_era_keyset_probe.py' -v
      - name: Stage43G-60 and 30-32 regression
        run: |
          python -m unittest discover -s tests -p 'test_stage43g60_cross_era_year_catalog.py' -v
          python -m unittest discover -s tests -p 'test_stage43g30_cross_era_read_gate.py' -v
          python -m unittest discover -s tests -p 'test_stage43g31_cross_era_browse_model.py' -v
          python -m unittest discover -s tests -p 'test_stage43g32_cross_era_navigation.py' -v
