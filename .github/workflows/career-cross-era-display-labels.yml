name: Cross-era Tk school and player names

on:
  pull_request:
    paths:
      - "phase2_engine/career_cross_era_display_labels.py"
      - "phase2_engine/career_cross_era_gui_pilot.py"
      - "phase2_engine/career_history_gui_pilot.py"
      - "tests/test_stage43g34_cross_era_display_labels.py"
      - ".github/workflows/career-cross-era-display-labels.yml"
  push:
    branches: [main]
    paths:
      - "phase2_engine/career_cross_era_display_labels.py"
      - "phase2_engine/career_cross_era_gui_pilot.py"
      - "phase2_engine/career_history_gui_pilot.py"
      - ".github/workflows/career-cross-era-display-labels.yml"

permissions:
  contents: read

jobs:
  accurate_names_and_tk:
    name: Exact-year player identities, school names and Tk keyboard navigation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ensure virtual Tk display available
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
      - name: Run Tk + immutable roster/name provenance tests
        run: |
          xvfb-run -a python -m unittest discover -s tests -p 'test_stage43g34_cross_era_display_labels.py' -v
      - name: Check Stage43G-33 Tk navigation regression
        run: |
          xvfb-run -a python -m unittest discover -s tests -p 'test_stage43g33_cross_era_gui_pilot.py' -v
