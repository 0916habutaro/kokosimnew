name: Stage43G-99 Windows SQLite lifetime and old backup

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage43g99-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows_product:
    name: Windows Python 3.12 product handles and pre-change backup
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Preserve reviewed catalog bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Actual pre-change export and same-process lifetime regression
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path audit-results | Out-Null
          python tests/stage43g99_audit.py --require-windows --json-output audit-results/product.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stage43g99-windows-product
          path: audit-results/*.json
          if-no-files-found: error
          retention-days: 14

  windows_native_tk:
    name: Windows Python 3.12 native Tk product history handles
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Preserve reviewed catalog bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Mapped native history child windows errors close and restart
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path audit-results | Out-Null
          python tests/stage43g99_audit.py --require-windows --gui --json-output audit-results/tk.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stage43g99-windows-native-tk
          path: audit-results/*.json
          if-no-files-found: error
          retention-days: 14
