name: Stage43G-49 Gifu sealed autumn bypass to spring MAIN

on:
  pull_request:
    paths:
      - "phase2_engine/future_gifu_sealed_autumn_bridge.py"
      - "phase2_engine/career_multi_preview_checkpoint.py"
      - "tests/test_stage43g49_gifu_sealed_autumn_bypass.py"
      - ".github/workflows/career-gifu-sealed-autumn.yml"
  push:
    branches: [main]
    paths:
      - "phase2_engine/future_gifu_sealed_autumn_bridge.py"
      - "phase2_engine/career_multi_preview_checkpoint.py"
      - "tests/test_stage43g49_gifu_sealed_autumn_bypass.py"

permissions:
  contents: read

jobs:
  gifu_sealed_previous_autumn:
    name: Sealed 2026 Gifu game top four bypass qualifiers and qualify 2027 Tokai seats
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Stage43G-49 sealed autumn Gifu multi-preview E2E
        run: |
          python -m unittest discover -s tests -p 'test_stage43g49_gifu_sealed_autumn_bypass.py' -v
      - name: Stage43F-7 prior-autumn bypass and Stage43G-48 Shizuoka regression
        run: |
          python -m unittest discover -s tests -p 'test_stage43f7_gifu_tokyo_access.py' -v
          python -m unittest discover -s tests -p 'test_stage43g48_shizuoka_tokai_partial_feeder.py' -v
