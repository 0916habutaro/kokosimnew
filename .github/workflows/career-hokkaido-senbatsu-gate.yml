name: Stage43G-42 Hokkaido spring from completed same-year Senbatsu

on:
  pull_request:
    paths:
      - "phase2_engine/career_hokkaido_senbatsu_gate.py"
      - "tests/test_stage43g42_hokkaido_senbatsu_same_year_gate.py"
      - ".github/workflows/career-hokkaido-senbatsu-gate.yml"
  push:
    branches: [main]
    paths:
      - "phase2_engine/career_hokkaido_senbatsu_gate.py"
      - "tests/test_stage43g42_hokkaido_senbatsu_same_year_gate.py"

permissions:
  contents: read

jobs:
  same_year_senbatsu:
    name: Complete Senbatsu A-history authorizes spring Hokkaido recommendation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Same-year saved Senbatsu and FMT001 recommendation integrity
        run: |
          python -m unittest discover -s tests -p 'test_stage43g42_hokkaido_senbatsu_same_year_gate.py' -v
      - name: Hokkaido autumn saved E2E regression
        run: |
          python -m unittest discover -s tests -p 'test_stage43g41_hokkaido_autumn_qualifier_career_e2e.py' -v
