name: Stage43G-62 Historical GUI bridge read-only contract

on:
  pull_request:
    paths:
      - "phase2_engine/career_history_gui_bridge.py"
      - "tests/test_stage43g62_history_gui_bridge.py"
      - ".github/workflows/career-history-gui-bridge.yml"
  push:
    branches: [main]
    paths:
      - "phase2_engine/career_history_gui_bridge.py"
      - "tests/test_stage43g62_history_gui_bridge.py"

permissions:
  contents: read

jobs:
  history_bridge:
    name: GUI handoff exact IDs no progression read-only archive
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Stage43G-62 history navigation bridge
        run: |
          python -m unittest discover -s tests -p 'test_stage43g62_history_gui_bridge.py' -v
      - name: Stage43G-60 and 61 saved-year source and cursor regression
        run: |
          python -m unittest discover -s tests -p 'test_stage43g60_cross_era_year_catalog.py' -v
          python -m unittest discover -s tests -p 'test_stage43g61_cross_era_keyset_probe.py' -v
      - name: Stage43G-31 and 32 school player match navigation regression
        run: |
          python -m unittest discover -s tests -p 'test_stage43g31_cross_era_browse_model.py' -v
          python -m unittest discover -s tests -p 'test_stage43g32_cross_era_navigation.py' -v
