name: Cross-era verified match drilldown

on:
  pull_request:
    paths:
      - "phase2_engine/career_cross_era_browse_model.py"
      - "phase2_engine/career_cross_era_navigation.py"
      - "phase2_engine/career_cross_era_gui_pilot.py"
      - "tests/test_stage43g35_cross_era_match_details.py"
      - ".github/workflows/career-cross-era-match-details.yml"
  push:
    branches: [main]
    paths:
      - "phase2_engine/career_cross_era_browse_model.py"
      - "phase2_engine/career_cross_era_navigation.py"
      - "phase2_engine/career_cross_era_gui_pilot.py"

permissions:
  contents: read

jobs:
  match_details_tk:
    name: Saved inning, batter and pitcher record navigation in real Tk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ensure virtual Tk display available
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
      - name: Stage43G-35 exact source and real Tk
        run: |
          xvfb-run -a python -m unittest discover -s tests -p 'test_stage43g35_cross_era_match_details.py' -v
      - name: Cross-era navigation, labels and Tk regressions
        run: |
          xvfb-run -a python -m unittest discover -s tests -p 'test_stage43g3[134]*.py' -v
