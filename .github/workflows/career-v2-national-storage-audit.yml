name: Stage43G-87 national full-A storage and indexed search audit

on:
  pull_request:
    paths:
      - "phase2_engine/career_v2_national_storage_audit.py"
      - "phase2_engine/career_v2_school_read_index.py"
      - "phase2_engine/career_v2_school_century_shards.py"
      - "phase2_engine/career_v2_option_a_archive.py"
      - "tests/test_stage43g87_v2_national_storage_audit.py"
      - ".github/workflows/career-v2-national-storage-audit.yml"
  push:
    branches: [main]
    paths:
      - "phase2_engine/career_v2_national_storage_audit.py"
      - "tests/test_stage43g87_v2_national_storage_audit.py"
  workflow_dispatch:
    inputs:
      load_case:
        description: "手動負荷試験（架空fixture・全国100/200年実大会ではない）"
        type: choice
        default: regression
        options: [regression, medium1000, national3746, sparse200, shards32]

permissions:
  contents: read

jobs:
  regression:
    name: Seeded complete-A storage, source SHA and fail-closed school pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Stage43G-87 independent oracle and abnormal cases
        run: python -m unittest discover -s tests -p 'test_stage43g87_v2_national_storage_audit.py' -v
      - name: Small 100-school, 2-year complete-A measurement
        run: |
          mkdir -p audit-results
          python -m phase2_engine.career_v2_national_storage_audit --survey-master > audit-results/master.json
          python -m phase2_engine.career_v2_national_storage_audit --schools 100 --years 2 --rounds 4 --repeats 3 > audit-results/small100.json
      - name: Regress sealed indexes and long-span source verification
        run: |
          python -m unittest discover -s tests -p 'test_stage43g79_v2_school_read_index.py' -v
          python -m unittest discover -s tests -p 'test_stage43g83_v2_century_shards.py' -v
          python -m unittest discover -s tests -p 'test_stage43g86_v2_century_shard_scale.py' -v
      - uses: actions/upload-artifact@v6
        with:
          name: stage43g87-small-metrics
          path: audit-results/*.json
          retention-days: 14

  load:
    name: Optional bounded national density or sparse long history
    if: github.event_name == 'workflow_dispatch' && inputs.load_case != 'regression'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Measure selected disposable fixture
        env:
          LOAD_CASE: ${{ inputs.load_case }}
        run: |
          mkdir -p audit-results
          case "$LOAD_CASE" in
            medium1000) python -m phase2_engine.career_v2_national_storage_audit --schools 1000 --years 1 --rounds 10 --repeats 3 --allow-large > audit-results/medium1000.json ;;
            national3746) python -m phase2_engine.career_v2_national_storage_audit --schools 3746 --years 1 --rounds 10 --repeats 3 --allow-large > audit-results/national3746.json ;;
            sparse200) python -m phase2_engine.career_v2_national_storage_audit --schools 2 --years 200 --rounds 2 --repeats 3 > audit-results/sparse200.json ;;
            shards32) python -m phase2_engine.career_v2_national_storage_audit --schools 100 --years 32 --rounds 2 --year-step 100 --repeats 3 --allow-large > audit-results/shards32.json ;;
            *) exit 2 ;;
          esac
      - uses: actions/upload-artifact@v6
        with:
          name: stage43g87-load-metrics
          path: audit-results/*.json
          retention-days: 14
