name: Stage43G-71 Old-A stats cache PK duplicate and V2 search indexes

on:
  pull_request:
    paths:
      - "phase2_engine/career_player_stat_cache.py"
      - "phase2_engine/career_stats_cache_btree_audit.py"
      - "tests/test_stage43g71_stats_cache_index_audit.py"
      - ".github/workflows/career-stats-cache-btree-audit.yml"
  push:
    branches: [main]
    paths:
      - "phase2_engine/career_player_stat_cache.py"
      - "phase2_engine/career_stats_cache_btree_audit.py"
      - "tests/test_stage43g71_stats_cache_index_audit.py"

permissions:
  contents: read

jobs:
  cache_index_compatibility:
    name: Old and new Option-A stats cache PK/player seek index and source immutability
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Stage43G-71 legacy and v2 cache index structure and read-only audit
        run: |
          python -m unittest discover -s tests -p 'test_stage43g71_stats_cache_index_audit.py' -v
      - name: Raw Option A stats and independent v2 cache regressions
        run: |
          python -m unittest discover -s tests -p 'test_stage43g15_sealed_player_cache.py' -v
          python -m unittest discover -s tests -p 'test_stage43g29_v2_player_stat_cache.py' -v
          python -m unittest discover -s tests -p 'test_stage43g70_storage_btree_audit.py' -v
      - name: Preserve measured derived-cache B-tree bytes as CI JSON
        env:
          PYTHONPATH: tests
        run: |
          mkdir -p build/reports
          python - <<'PY'
          import json
          from pathlib import Path
          from test_stage43g71_stats_cache_index_audit import Stage43G71CacheIndexTests
          from phase2_engine.career_stats_cache_btree_audit import (
              audit_saved_stats_cache_indexes,
          )
          fixture = Stage43G71CacheIndexTests(
              "test_both_files_btree_allocation_and_sqlite_hashes_unchanged",
          )
          fixture.setUp()
          try:
              report = audit_saved_stats_cache_indexes(
                  legacy_cache=fixture.legacy_path,
                  v2_cache=fixture.v2_path,
              )
              Path("build/reports/stage43g71_cache_btrees.json").write_text(
                  json.dumps(report, ensure_ascii=False, indent=2),
                  encoding="utf-8",
              )
              print("observed cache file bytes",
                    report["observed_cache_file_bytes"])
              print("legacy duplicate present",
                    report["files"]["legacy"]["old_duplicate_index_present"])
              print("distinct v2 player index",
                    report["files"]["v2"]["distinct_player_first_index"])
          finally:
              fixture.doCleanups()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage43g71-derived-cache-index-measurements
          path: build/reports/stage43g71_cache_btrees.json
          retention-days: 30
          if-no-files-found: error
