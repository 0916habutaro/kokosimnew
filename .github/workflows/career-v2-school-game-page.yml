name: Stage43G-76 Sealed v2 school game page

on:
  pull_request:
    paths:
      - "phase2_engine/career_v2_school_game_page.py"
      - "phase2_engine/career_v2_option_a_archive.py"
      - "tests/test_stage43g76_v2_school_game_page.py"
      - ".github/workflows/career-v2-school-game-page.yml"
  push:
    branches: [main]
    paths:
      - "phase2_engine/career_v2_school_game_page.py"
      - "phase2_engine/career_v2_option_a_archive.py"
      - "tests/test_stage43g76_v2_school_game_page.py"

permissions:
  contents: read

jobs:
  v2_school_games:
    name: Sealed v2 JSON1 match paging SHA and legacy separation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Stage43G-76 v2 school page coverage
        run: python -m unittest discover -s tests -p 'test_stage43g76_v2_school_game_page.py' -v
      - name: Stage43G-27 v2 original and Stage43G-74 legacy A regressions
        run: |
          python -m unittest discover -s tests -p 'test_stage43g27_v2_option_a_archive.py' -v
          python -m unittest discover -s tests -p 'test_stage43g74_indexed_school_game_page.py' -v
