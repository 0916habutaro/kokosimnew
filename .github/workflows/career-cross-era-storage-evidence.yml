name: Stage43G-69 Independent legacy-v2 retained-A evidence comparison

on:
  pull_request:
    paths:
      - "phase2_engine/career_cross_era_storage_evidence.py"
      - "tests/test_stage43g69_cross_era_storage_evidence.py"
      - ".github/workflows/career-cross-era-storage-evidence.yml"
  push:
    branches: [main]
    paths:
      - "phase2_engine/career_cross_era_storage_evidence.py"
      - "tests/test_stage43g69_cross_era_storage_evidence.py"

permissions:
  contents: read

jobs:
  evidence_comparison:
    name: Separate 12-year Option-A evidence no false savings or merged history
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Stage43G-69 independent source measurement contract
        run: |
          python -m unittest discover -s tests -p 'test_stage43g69_cross_era_storage_evidence.py' -v
      - name: Stage43G-67 and 68 long A source integrity regression
        run: |
          python -m unittest discover -s tests -p 'test_stage43g67_long_full_a_audit.py' -v
          python -m unittest discover -s tests -p 'test_stage43g68_v2_long_storage_audit.py' -v
      - name: Generate observed reports from separate disposable saved sources
        env:
          PYTHONPATH: tests
        run: |
          mkdir -p build/reports
          python - <<'PY'
          import json
          from pathlib import Path
          from phase2_engine.career_long_full_a_audit import run_long_full_a_audit
          from phase2_engine.career_v2_long_storage_audit import audit_saved_v2_storage
          from test_stage43g68_v2_long_storage_audit import Stage43G68V2LongStorageAuditTests
          report_dir = Path("build/reports")
          legacy = run_long_full_a_audit(
              "data", schools=2, years=12, games_per_school_year=2, repeats=1,
          )
          (report_dir / "stage43g67_actual_legacy.json").write_text(
              json.dumps(legacy, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          fixture = Stage43G68V2LongStorageAuditTests(
              "test_twelve_v2_years_true_roster_progression_full_a_and_size",
          )
          fixture.setUp()
          try:
              fixture._progress(10011)
              future = audit_saved_v2_storage(
                  fixture.root, list(range(10000, 10012)),
              )
              (report_dir / "stage43g68_actual_v2.json").write_text(
                  json.dumps(future, ensure_ascii=False, indent=2),
                  encoding="utf-8",
              )
          finally:
              fixture.doCleanups()
          PY
      - name: Preserve sourced, separate and defensible comparison JSON
        run: |
          python -m phase2_engine.career_cross_era_storage_evidence \
            --legacy-report build/reports/stage43g67_actual_legacy.json \
            --v2-report build/reports/stage43g68_actual_v2.json \
            --output-json build/reports/stage43g69_independent_compare.json
      - uses: actions/upload-artifact@v4
        with:
          name: stage43g69-legacy-v2-independent-source-evidence
          path: build/reports/*.json
          retention-days: 30
          if-no-files-found: error
