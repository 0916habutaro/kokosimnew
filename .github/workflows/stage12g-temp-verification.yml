name: Stage 12G temporary verification

on:
  push:
    branches:
      - stage12g-shikoku-schedules

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Season E2E markers
        run: |
          python - <<'PY'
          from pathlib import Path
          from phase2_engine import DataRepository, SeasonOrchestrator
          data = Path("data")
          season = SeasonOrchestrator(DataRepository(data), data).run_structural_season(2026, 2026100501)
          passed = sum(r.status == "PASS" for r in season.prefectural_rows)
          print(f"PREFECTURAL_PASS={passed}")
          print(f"PREFECTURAL_TOTAL={len(season.prefectural_rows)}")
          print(f"CALENDAR_GAPS={len(season.calendar_gaps)}")
          print(f"WARNINGS={season.warnings}")
          PY
