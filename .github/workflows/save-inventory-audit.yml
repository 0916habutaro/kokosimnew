name: Stage43G-91 save originals inventory (no adoption)

on:
  pull_request:
    paths:
      - "phase2_engine/save_inventory_audit.py"
      - "phase2_engine/live_season_save.py"
      - "phase2_engine/save_slots.py"
      - "phase2_engine/live_game_service.py"
      - "phase2_engine/historical_match_archive.py"
      - "phase2_engine/career_*.py"
      - "tests/test_stage43g91_*.py"
      - "docs/research/stage43g91_*.md"
      - "docs/adr/ADR-032-*.md"
      - ".github/workflows/save-inventory-audit.yml"
  push:
    branches: [main]
    paths:
      - "phase2_engine/save_inventory_audit.py"
      - "tests/test_stage43g91_*.py"
      - ".github/workflows/save-inventory-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    name: Save inventory on ${{ matrix.os }} Python 3.12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Owned-fixture inventory and legacy boundary evidence
        run: |
          mkdir -p audit-results
          python -m phase2_engine.save_inventory_audit --json-output audit-results/inventory.json
          python - <<'PY'
          import json
          from pathlib import Path
          evidence = json.loads(Path("audit-results/inventory.json").read_text(encoding="utf-8"))
          assert evidence["successful"] and evidence["tests"] == 20
          assert evidence["skipped"] == 0
          assert evidence["fixture_only"] and not evidence["generation_adopted"]
          assert not evidence["production_writers_changed"] and not evidence["restoration_authorized"]
          PY
      - name: Legacy replay slots and immutable history regressions
        run: |
          python -m unittest discover -s tests -p 'test_stage13e3e1_full_season_save_load.py' -v
          python -m unittest discover -s tests -p 'test_stage13e3e2_save_slots_game_service.py' -v
          python -m unittest discover -s tests -p 'test_stage43c*_*.py' -v
          python -m unittest discover -s tests -p 'test_stage43f*_*.py' -v
          python -m unittest discover -s tests -p 'test_stage43g11_*.py' -v
          python -m unittest discover -s tests -p 'test_stage43g12_*.py' -v
      - name: Previous v2 snapshot and recovery contracts
        run: |
          python -m unittest discover -s tests -p 'test_stage43g89_*.py' -v
          python -m unittest discover -s tests -p 'test_stage43g90_*.py' -v
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stage43g91-inventory-${{ matrix.os }}
          path: audit-results/inventory.json
          retention-days: 14
