name: Stage43G-68 Fictional v2 complete-A storage and deep verification audit

on:
  pull_request:
    paths:
      - "phase2_engine/career_v2_long_storage_audit.py"
      - "tests/test_stage43g68_v2_long_storage_audit.py"
      - ".github/workflows/career-v2-long-storage-audit.yml"
  push:
    branches: [main]
    paths:
      - "phase2_engine/career_v2_long_storage_audit.py"
      - "tests/test_stage43g68_v2_long_storage_audit.py"

permissions:
  contents: read

jobs:
  v2_long_deep_audit:
    name: 12 fictional v2 years sealed A calendars rosters and separate cache
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Stage43G-68 deep fictional v2 12-year storage audit
        run: |
          python -m unittest discover -s tests -p 'test_stage43g68_v2_long_storage_audit.py' -v
      - name: V2 calendar sealed match attribution/cache and cross-era regression
        run: |
          python -m unittest discover -s tests -p 'test_stage43g27_v2_option_a_archive.py' -v
          python -m unittest discover -s tests -p 'test_stage43g28_v2_roster_attribution.py' -v
          python -m unittest discover -s tests -p 'test_stage43g29_v2_player_stat_cache.py' -v
          python -m unittest discover -s tests -p 'test_stage43g31_cross_era_browse_model.py' -v
      - name: Preserve observed fictional v2 year-by-year bytes and deep read times
        env:
          PYTHONPATH: tests
        run: |
          mkdir -p build/reports
          python - <<'PY'
          import json
          from pathlib import Path
          from test_stage43g68_v2_long_storage_audit import (
              Stage43G68V2LongStorageAuditTests,
          )
          from phase2_engine.career_v2_long_storage_audit import (
              audit_saved_v2_storage,
          )
          fixture = Stage43G68V2LongStorageAuditTests(
              "test_twelve_v2_years_true_roster_progression_full_a_and_size",
          )
          fixture.setUp()
          try:
              fixture._progress(10011)
              report = audit_saved_v2_storage(
                  fixture.root, list(range(10000, 10012)),
              )
              Path("build/reports/stage43g68_v2_12year.json").write_text(
                  json.dumps(report, ensure_ascii=False, indent=2),
                  encoding="utf-8",
              )
              print("selected v2 years", report["selected_year_count"])
              print("measured v2 matches", sum(
                  row["match_count"] for row in report["year_rows"]
              ))
              print("four saved SQLite files, physical bytes",
                    report["total_v2_roster_cache_calendar_sqlite_file_bytes"])
              print("selected annual JSON bytes",
                    report["selected_json_bytes_total"])
          finally:
              fixture.doCleanups()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage43g68-fictional-v2-12year-measured-json
          path: build/reports/stage43g68_v2_12year.json
          retention-days: 30
          if-no-files-found: error
