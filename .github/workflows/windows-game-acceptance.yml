name: Windows personal game acceptance

# Windows専用ゲームの本体（保存・読込・スロット・履歴・Tk閲覧画面）をWindows上で確認する。
# Linuxでの同じテストは python-tests.yml の全件実行に含まれるため、ここではWindowsのみ実行する。

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-game-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows_acceptance:
    name: Windows Python 3.12 product save load and Tk browse
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Classify CI workload (fail closed)
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python tests/ci_change_scope.py
      - name: Verify documentation-only routing
        if: steps.scope.outputs.docs_only == 'true'
        run: python -m unittest discover -s tests -p 'test_ci_change_scope.py' -v
      - name: Product save load slots history and Tk browse tests on Windows
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          $patterns = @(
            'test_stage13e3e1_full_season_save_load.py',
            'test_stage13e3e2_save_slots_game_service.py',
            'test_stage13e3e3_cli_metadata_migration.py',
            'test_stage43c_live_history_archive.py',
            'test_stage43c2_incremental_checkpoint.py',
            'test_stage43d_career_year_boundary.py',
            'test_stage43e_career_rosters.py',
            'test_stage12s_readonly_gui.py',
            'test_stage12t_gui_filters_bracket_navigation.py',
            'test_stage12u_gui_home_filters.py',
            'test_stage13d3_readonly_gui_player_stats.py'
          )
          foreach ($p in $patterns) {
            python -m unittest discover -s tests -t tests -p $p -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
