name: Stage43G-84 V2 cross-century school Tk search

on:
  pull_request:
    paths:
      - "phase2_engine/career_v2_school_game_tk.py"
      - "phase2_engine/career_legacy_school_game_tk.py"
      - "phase2_engine/career_v2_school_century_shards.py"
      - "tests/test_stage43g84_v2_cross_century_tk.py"
      - ".github/workflows/career-v2-cross-century-tk.yml"
  push:
    branches: [main]
    paths:
      - "phase2_engine/career_v2_school_game_tk.py"
      - "phase2_engine/career_legacy_school_game_tk.py"
      - "phase2_engine/career_v2_school_century_shards.py"
      - "tests/test_stage43g84_v2_cross_century_tk.py"

permissions:
  contents: read

jobs:
  century_tk:
    name: Read-only century search Tk, strict source and page rollback
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ensure virtual Tk display exists
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
      - name: Stage43G-84 headless and real Tk
        run: |
          xvfb-run -a python -m unittest discover -s tests -p 'test_stage43g84_v2_cross_century_tk.py' -v
      - name: Regress Stage43G-83 multi-century model and Stage43G-82 source selection
        run: |
          python -m unittest discover -s tests -p 'test_stage43g83_v2_century_shards.py' -v
          xvfb-run -a python -m unittest discover -s tests -p 'test_stage43g82_v2_school_index_versions_tk.py' -v
