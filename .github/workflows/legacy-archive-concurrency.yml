name: Stage43G-92 legacy archive writer serialization

on:
  pull_request:
    paths:
      - 'phase2_engine/yamanashi_demo*.py'
      - 'tests/*stage43g109*.py'
      - 'phase2_engine/yamanashi_tournament*.py'
      - 'tests/*stage43g108*.py'
      - 'phase2_engine/joint_tournament*.py'
      - 'tests/*stage43g107*.py'
      - 'tests/*stage43g103*.py'
      - 'tests/*stage43g104*.py'
      - 'tests/*stage43g105*.py'
      - 'phase2_engine/registered_*.py'
      - 'phase2_engine/joint_team_registration*.py'
      - "phase2_engine/historical_match_archive.py"
      - "phase2_engine/legacy_archive_concurrency_audit.py"
      - "phase2_engine/live_game_service.py"
      - "phase2_engine/live_season_save.py"
      - "phase2_engine/save_slots.py"
      - "tests/test_stage43g92_*.py"
      - "tests/stage43g92_fixture_support.py"
      - "tests/test_stage43g91_*.py"
      - "tests/stage43g91_fixture_support.py"
      - "docs/research/stage43g92_*.md"
      - ".github/workflows/legacy-archive-concurrency.yml"
  push:
    branches: [main]
    paths:
      - 'phase2_engine/yamanashi_demo*.py'
      - 'tests/*stage43g109*.py'
      - "phase2_engine/historical_match_archive.py"
      - "phase2_engine/legacy_archive_concurrency_audit.py"
      - "tests/test_stage43g92_*.py"
      - "tests/stage43g92_fixture_support.py"
      - ".github/workflows/legacy-archive-concurrency.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy:
    name: Legacy WAL and DELETE on ${{ matrix.os }} Python 3.12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Legacy writer races and actual live sealed replay
        run: |
          mkdir -p audit-results
          python -m phase2_engine.legacy_archive_concurrency_audit --json-output audit-results/legacy.json > audit-results/legacy.log 2>&1
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("audit-results/legacy.json").read_text(encoding="utf-8"))
          assert data["successful"] and data["tests"] == 21
          assert data["skipped"] == 0
          assert data["subtest_schedules"] == 52
          assert all(row["successful"] for row in data["schedules"])
          assert data["fixture_only"] and not data["schema_changed"] and not data["generation_adopted"]
          PY
      - name: Stage91 inventory and updated safe boundary regression
        run: |
          python -m phase2_engine.save_inventory_audit --json-output audit-results/inventory.json > audit-results/inventory.log 2>&1
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("audit-results/inventory.json").read_text(encoding="utf-8"))
          assert data["successful"] and data["tests"] == 20 and data["skipped"] == 0
          PY
      - name: Display diagnostics on failure
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in sorted(Path("audit-results").glob("*")):
              print(p.name)
              print(p.read_text(encoding="utf-8", errors="replace"))
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stage43g92-legacy-${{ matrix.os }}
          path: audit-results/*
          retention-days: 14

  previous_contracts:
    name: Legacy history and v2 independence with real Tk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ensure virtual Tk display
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
      - name: Stage89 v2 concurrency and real Tk remain independent
        run: |
          mkdir -p audit-results
          xvfb-run -a python -m phase2_engine.career_v2_sqlite_concurrency_audit --json-output audit-results/v2.json > audit-results/v2.log 2>&1
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("audit-results/v2.json").read_text())
          assert data["successful"] and data["tests"] == 19
          assert data["skipped"] == 0 and data["subtest_schedules"] == 54
          PY
      - name: Legacy save slots school browsing and real Tk regressions
        run: |
          for pattern in 'test_stage13e3e1_*.py' 'test_stage13e3e2_*.py' 'test_stage43c*_*.py' 'test_stage43d_*.py' 'test_stage43e_*.py' 'test_stage43g11_*.py' 'test_stage43g12_*.py' 'test_stage43g65_*.py' 'test_stage43g75_*.py' 'test_stage43g77_*.py'; do
            xvfb-run -a python -m unittest discover -s tests -p "$pattern" -v
          done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stage43g92-v2-tk
          path: audit-results/*
          retention-days: 14
