name: Stage43G-102 Windows master-scale Yamanashi33 game fixture

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage43g102-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows_product:
    name: Windows Python 3.12 33-school crashes and four old candidates
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Preserve reviewed catalog input bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Fourteen master-scale and old candidate checks with zero skips
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path audit-results | Out-Null
          python tests/stage43g102_audit.py --require-windows --json-output audit-results/product.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stage43g102-windows-product
          path: audit-results/*.json
          if-no-files-found: error
          retention-days: 14

  windows_native_tk:
    name: Windows Python 3.12 native Tk all33 schools tournament full A and permanent players
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Preserve reviewed input bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Real process replay mapped Tk and native close with zero skips
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path audit-results | Out-Null
          python tests/stage43g102_audit.py --require-windows --gui --json-output audit-results/tk.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stage43g102-windows-native-tk
          path: audit-results/*.json
          if-no-files-found: error
          retention-days: 14

  linux_auxiliary:
    name: Auxiliary Linux 33-school persistence and mapped Tk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Disposable fixtures with zero target skips
        run: |
          mkdir -p audit-results
          python tests/stage43g102_audit.py --json-output audit-results/product.json
          xvfb-run -a python tests/stage43g102_audit.py --gui --json-output audit-results/tk.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stage43g102-linux-auxiliary
          path: audit-results/*.json
          if-no-files-found: error
          retention-days: 14
