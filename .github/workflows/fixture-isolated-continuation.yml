name: Stage43G-96 fixture deterministic continuation

on:
  pull_request:
    paths:
      - 'phase2_engine/school_roster_*.py'
      - 'tests/*stage43g112*.py'
      - 'tests/*stage43g113*.py'
      - 'tests/*stage43g114*.py'
      - 'tests/*stage43g115*.py'
      - 'tests/*stage43g116*.py'
      - 'phase2_engine/saved_fictional_tournament.py'
      - 'phase2_engine/fictional_tournament_oracle.py'
      - 'tests/*stage43g117*.py'
      - 'phase2_engine/saved_fictional_bracket.py'
      - 'phase2_engine/fictional_bracket.py'
      - 'phase2_engine/fictional_bracket_oracle.py'
      - 'phase2_engine/competition_evidence_gates.py'
      - 'phase2_engine/saved_practice_match.py'
      - 'phase2_engine/saved_school_roster_source.py'
      - 'phase2_engine/cross_prefecture_roster_selection.py'
      - 'phase2_engine/yamanashi_annual_rosters.py'
      - 'tests/*stage43g111*.py'
      - 'phase2_engine/yamanashi_demo*.py'
      - 'tests/*stage43g109*.py'
      - 'phase2_engine/yamanashi_tournament*.py'
      - 'tests/*stage43g108*.py'
      - 'phase2_engine/joint_tournament*.py'
      - 'tests/*stage43g107*.py'
      - 'tests/*stage43g103*.py'
      - 'tests/*stage43g104*.py'
      - 'tests/*stage43g105*.py'
      - 'phase2_engine/registered_*.py'
      - 'phase2_engine/joint_team_registration*.py'
      - 'phase2_engine/manual_save_backup*.py'
      - 'phase2_engine/legacy_backup*.py'
      - 'phase2_engine/save_inventory_audit.py'
      - 'phase2_engine/historical_match_archive.py'
      - 'phase2_engine/career_roster_archive.py'
      - 'phase2_engine/live*.py'
      - 'phase2_engine/save_slots.py'
      - 'game_core/**'
      - 'data/**'
      - 'config/**'
      - 'tests/*stage43g9*.py'
      - 'tests/stage43g96_*.py'
      - 'docs/research/stage43g96_*.md'
      - 'docs/adr/ADR-033*'
      - '.github/workflows/fixture-isolated-continuation.yml'
  push:
    branches: [main]
    paths:
      - 'phase2_engine/school_roster_*.py'
      - 'tests/*stage43g112*.py'
      - 'tests/*stage43g113*.py'
      - 'tests/*stage43g114*.py'
      - 'tests/*stage43g115*.py'
      - 'tests/*stage43g116*.py'
      - 'phase2_engine/saved_fictional_tournament.py'
      - 'phase2_engine/fictional_tournament_oracle.py'
      - 'tests/*stage43g117*.py'
      - 'phase2_engine/saved_fictional_bracket.py'
      - 'phase2_engine/fictional_bracket.py'
      - 'phase2_engine/fictional_bracket_oracle.py'
      - 'phase2_engine/competition_evidence_gates.py'
      - 'phase2_engine/saved_practice_match.py'
      - 'phase2_engine/saved_school_roster_source.py'
      - 'phase2_engine/cross_prefecture_roster_selection.py'
      - 'phase2_engine/yamanashi_annual_rosters.py'
      - 'tests/*stage43g111*.py'
      - 'phase2_engine/yamanashi_demo*.py'
      - 'tests/*stage43g109*.py'
      - 'phase2_engine/manual_save_backup*.py'
      - 'phase2_engine/legacy_backup*.py'
      - 'tests/*stage43g9*.py'
      - '.github/workflows/fixture-isolated-continuation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated_continuation:
    name: Actual isolated replay and continuation on ${{ matrix.os }} Python 3.12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Native Windows fixture copies/replays exceeded 20 minutes in Stage97.
    # Keep every regression and its assertions; allow completion on Windows.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 30 || 20 }}
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve the reviewed compatibility input bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Private SQL SHA oracle and isolated fault regression
        run: |
          mkdir -p audit-results
          python tests/stage43g96_audit.py --json-output audit-results/isolated.json > audit-results/isolated.log 2>&1
          python - <<'PYCODE'
          import json
          from pathlib import Path
          d=json.loads(Path('audit-results/isolated.json').read_text(encoding='utf-8'))
          assert d['successful'] and d['tests']==20 and d['skipped']==0
          assert d['fixture_only'] and not d['production_writers_changed']
          assert not d['restoration_authorized'] and not d['whole_game_restore_proven']
          assert len(d['metrics'])==6
          assert {(m['phase'],m['source']) for m in d['metrics']} == {(p,s) for p in ('active','sealed','registered') for s in ('manual','autosave')}
          assert all(m['logical_sql_equal'] and m['checkpoint_equal'] and m['runtime_equal'] and m['full_a_roster_ledger_outcomes_equal'] and m['sync_idempotent'] for m in d['metrics'])
          assert all(m['source_zero_write'] and m['candidate_zero_write'] and m['evidence_zero_write'] for m in d['metrics'])
          assert all(m['reloaded'] and m['next_year_refused'] and not m['next_year_gameplay_started'] for m in d['metrics'])
          assert all(m['replay_matches_per_series']==(6 if m['phase']=='active' else 7) and m['continued_matches_per_series']==(1 if m['phase']=='active' else 0) and m['final_matches']==7 for m in d['metrics'])
          assert d['refusal_cases'] > 0 and not d['external_generation_version_proven']
          PYCODE
      - name: Stage95 read-only relocation regression
        run: |
          python tests/stage43g95_audit.py --json-output audit-results/stage95.json > audit-results/stage95.log 2>&1
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('audit-results/stage95.json').read_text(encoding='utf-8'))
          assert d['successful'] and d['tests']==20 and d['skipped']==0 and len(d['metrics'])==6
          PY
      - name: Product API and CLI on owned saves only
        run: |
          mkdir -p audit-results
          python -m phase2_engine.manual_save_backup_audit --json-output audit-results/manual.json > audit-results/manual.log 2>&1
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('audit-results/manual.json').read_text(encoding='utf-8'))
          assert data['successful'] and data['tests'] == 38 and data['skipped'] == 0
          assert data['fixture_only'] and not data['production_writers_changed']
          assert not data['restoration_authorized'] and not data['whole_game_restore_proven']
          assert len(data['metrics']) == 6
          assert {m['phase'] for m in data['metrics']} == {'active', 'sealed', 'registered'}
          assert all(m['source_zero_write'] and m['no_clobber'] for m in data['metrics'])
          assert all(m['counts']['legacy_complete_a_matches'] > 0 for m in data['metrics'])
          assert all(m['candidate_total_bytes'] > m['candidate_payload_bytes'] for m in data['metrics'])
          print(json.dumps({k:data[k] for k in ('os','tests','seconds','metrics')},ensure_ascii=False))
          PY
      - name: Stage91 Stage92 Stage93 and annual regression
        run: |
          python -m phase2_engine.save_inventory_audit --json-output audit-results/inventory.json > audit-results/inventory.log 2>&1
          python -m phase2_engine.legacy_archive_concurrency_audit --json-output audit-results/concurrency.json > audit-results/concurrency.log 2>&1
          python -m phase2_engine.legacy_quiescent_export_audit --json-output audit-results/lab.json > audit-results/lab.log 2>&1
          python -m phase2_engine.legacy_quiescent_export_audit --annual-regressions --json-output audit-results/annual.json > audit-results/annual.log 2>&1
      - name: Existing Linux Stage89 contract and cross-platform read-only GUI
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y xvfb
            xvfb-run -a python -m phase2_engine.career_v2_sqlite_concurrency_audit --json-output audit-results/v2.json > audit-results/v2.log 2>&1
            xvfb-run -a python -m phase2_engine.manual_save_backup_audit --gui-regressions --json-output audit-results/tk.json > audit-results/tk.log 2>&1
          else
            python -m phase2_engine.manual_save_backup_audit --gui-regressions --json-output audit-results/tk.json > audit-results/tk.log 2>&1
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          checks = [('inventory',20),('concurrency',21),('lab',29),('annual',37)]
          # Stage89's existing Linux-only harness assumes canonical path
          # spelling and rename of open DBs. Keep all 19 assertions on Linux;
          # this stage does not port unrelated v2 behavior to Windows.
          if os.environ['RUNNER_OS'] == 'Linux':
              checks.append(('v2',19))
          for name, count in checks:
              d = json.loads(Path('audit-results',name+'.json').read_text(encoding='utf-8'))
              assert d['successful'] and d['tests'] == count and d['skipped'] == 0, name
          d = json.loads(Path('audit-results/tk.json').read_text(encoding='utf-8'))
          assert d['successful'] and d['tests'] == 15 and d['skipped'] == 0
          assert d['gui_fixture_teardown']
          PY
      - name: Show diagnostics on failure
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in sorted(Path('audit-results').glob('*')):
              print(p.name)
              print(p.read_text(encoding='utf-8',errors='replace'))
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stage43g96-continuation-${{ matrix.os }}
          path: audit-results/*
          retention-days: 14
