name: Python tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: Python 3.12 unittest
    runs-on: ubuntu-latest
    # テストのファイルごとに4つのプロセスで流す（tests/ci_unittest_timings.py）
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Classify CI workload (fail closed)
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python tests/ci_change_scope.py

      - name: Verify documentation-only routing
        if: steps.scope.outputs.docs_only == 'true'
        run: python -m unittest discover -s tests -p 'test_ci_change_scope.py' -v

      - name: Restore previous per-test timings
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/cache/restore@v4
        with:
          path: previous-timings
          key: unittest-timings-${{ github.run_id }}
          restore-keys: unittest-timings-

      - name: Run full unittest suite in parallel and capture timings
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          mkdir -p audit-results previous-timings
          python tests/ci_unittest_timings.py --workers 4 --previous previous-timings/unittest-timings.json --json-output audit-results/unittest-timings.json

      - name: Keep per-test timings for the next run's order
        if: always() && steps.scope.outputs.docs_only != 'true' && hashFiles('audit-results/unittest-timings.json') != ''
        run: cp audit-results/unittest-timings.json previous-timings/unittest-timings.json

      - name: Save per-test timings
        if: always() && steps.scope.outputs.docs_only != 'true' && hashFiles('audit-results/unittest-timings.json') != ''
        uses: actions/cache/save@v4
        with:
          path: previous-timings
          key: unittest-timings-${{ github.run_id }}

      - name: Upload per-test timings
        if: always() && steps.scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: full-unittest-timings
          path: audit-results/unittest-timings.json
          if-no-files-found: warn
          retention-days: 14
