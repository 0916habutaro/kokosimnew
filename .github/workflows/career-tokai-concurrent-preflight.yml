name: Stage43G-51 Tokai concurrent Senbatsu preseason freeze

on:
  pull_request:
    paths:
      - "phase2_engine/career_tokai_concurrent_preflight.py"
      - "phase2_engine/career_tokai_senbatsu_access_gate.py"
      - "tests/test_stage43g51_tokai_concurrent_preflight.py"
      - ".github/workflows/career-tokai-concurrent-preflight.yml"
  push:
    branches: [main]
    paths:
      - "phase2_engine/career_tokai_concurrent_preflight.py"
      - "tests/test_stage43g51_tokai_concurrent_preflight.py"

permissions:
  contents: read

jobs:
  tokai_preflight:
    name: Freeze Senbatsu 32 and Aichi/Mie 8 groups before any game and verify later
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Stage43G-51 two-phase Tokai frozen selection E2E
        run: |
          python -m unittest discover -s tests -p 'test_stage43g51_tokai_concurrent_preflight.py' -v
      - name: Stage43G-50 Senbatsu proof and Stage43G-8 full manifest regression
        run: |
          python -m unittest discover -s tests -p 'test_stage43g50_tokai_senbatsu_access_gate.py' -v
          python -m unittest discover -s tests -p 'test_stage43g8_senbatsu_manifest.py' -v
